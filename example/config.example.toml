# agent-cli configuration example
#
# Copy this file to one of the resolved locations and edit to taste:
#   ~/.config/agent-cli/config.toml
# or set the environment variable:  export AGENT_CLI_CONFIG=/path/to/config.toml
# or pass it explicitly:            agent-cli --config /path/to/config.toml
#
# Lines starting with `#` are comments. Uncomment / edit the values you need.

# ─────────────────────────────────────────────────────────────────────────────
# Provider: the AI backend. Only one `kind` is active at a time.
# Supported: "claude" | "claude-code" | "codex" | "ollama" | "opencode" |
#            "opencode-go" | "llama.cpp"
# ─────────────────────────────────────────────────────────────────────────────
[provider]
kind = "claude"

# --- Anthropic Claude (Messages API) ---
[provider.claude]
model       = "claude-opus-4-7"
api_key_env = "ANTHROPIC_API_KEY"          # env var holding the key
base_url    = "https://api.anthropic.com"
thinking    = true
# Opt-in: Anthropic prompt caching (system + tools + conversation tail).
# prompt_cache = true

# --- Claude Code CLI (drives the locally installed `claude` binary) ---
# No API key: it inherits whatever authentication Claude Code already has.
# Not the same backend as [provider.claude] above, which is the Anthropic API.
# [provider.claude-code]
# bin       = "claude"       # executable name (resolved via PATH) or full path
# model     = "sonnet"       # --model; omit for Claude Code's own default
# mode      = "delegation"   # "delegation" (Claude Code runs its own tools)
#                            # | "gateway"  (--tools "", chat only: agent-cli's
#                            #               tools cannot be offered to it)
# transport = "stream"       # "stream" (token streaming) | "oneshot"
# session   = "persistent"   # "persistent" | "ephemeral" (delegation only)
# turn_timeout_secs  = 900
# tools              = ["Bash", "Read"]  # --tools
# allowed_tools      = ["Bash(git *)"]   # --allowed-tools
# disallowed_tools   = ["WebFetch"]      # --disallowed-tools
# permission_mode    = "auto"            # --permission-mode
# max_budget_usd     = 1.0               # --max-budget-usd
# system_prompt_mode = "append"          # "append" | "replace"
# extra_args         = []                # passed through verbatim

# --- OpenAI (Codex) ---
# [provider.codex]
# model       = "gpt-4.1"
# api_key_env = "OPENAI_API_KEY"
# base_url    = "https://api.openai.com/v1"

# --- Ollama (local or cloud tag, OpenAI-compatible /api/chat) ---
# [provider.ollama]
# model    = "glm-5.1:cloud"
# base_url = "http://127.0.0.1:11434"

# --- OpenCode (local `opencode serve` or OpenCode Zen / Go cloud) ---
# [provider.opencode]
# # Local mode:
# base_url = "http://127.0.0.1:4096"
# model    = "claude-sonnet-4-5"
# # Cloud mode (OpenCode Zen / Go): a resolved api_key_env selects cloud mode.
# base_url    = "https://opencode.ai/zen/go/v1"
# api_key_env = "OPENCODE_API_KEY"
# model       = "claude-sonnet-4-5"
# # Wire format: "openai" (default, /chat/completions) or "anthropic" (/messages).
# api = "openai"
# # Opt-in (local mode only): reuse one server session across turns.
# persistent_session = true

# --- llama.cpp /v1/chat/completions (OpenAI-compatible) ---
# [provider."llama.cpp"]
# model    = "default"
# base_url = "http://127.0.0.1:8080"
# Optional sampling knobs (omit any => the server's own default):
# max_tokens     = 1024   # -n / --n-predict
# temperature    = 0.2    # --temp
# top_k          = 80     # --top-k
# top_p          = 0.95   # --top-p
# min_p          = 0.05   # --min-p
# repeat_penalty = 1.05   # --repeat-penalty
# repeat_last_n  = 64     # --repeat-last-n
# seed           = 0      # --seed

# ─────────────────────────────────────────────────────────────────────────────
# Runtime behavior and paths
# ─────────────────────────────────────────────────────────────────────────────
[runtime]
auto_approve_tools = false                # skip y/N approval for every tool call
log_dir            = "~/.local/share/agent-cli/logs"
registry_dir       = ""                   # empty => per-user default (/run/user/<uid>/agent-cli)
agents_dir         = "~/.config/agent-cli/agents"
persona_file       = ""                   # empty => built-in default persona
# Max tool-use iterations per turn (one iteration = LLM call -> tool calls + results).
# Default 24; raise for design-then-debug orchestrators that iterate on lint feedback.
max_tool_iterations = 24
# Directory scanned for custom `.md` slash commands (relative paths resolve
# against the current working directory).
commands_dir       = ".agent-cli/commands"
# group           = ""                    # default group id for agents this config launches;
                                          # --group overrides it, detached children inherit it.
                                          # Filter with `agent-cli list --group <id>`; discover
                                          # running cohorts with `agent-cli groups`.

# ─────────────────────────────────────────────────────────────────────────────
# Tools: which built-in tools the agent can call, and per-tool tuning.
# Tool set is aligned with Claude Code:
#   bash, read, write, send_to, list_agents, stop_agent, monitor, edit, glob,
#   grep, websearch, webfetch
#
# One built-in is deliberately left out of the list below: `spawn`, which lets
# the agent create detached agent-cli peers of its own. Creating processes is
# more impactful than the rest, so it is opt-in — add "spawn" to `enabled` to
# offer it, and see the [spawn] section for the limits that bound it. The agent
# can already see and stop what it created (`list_agents` / `stop_agent`), and
# hand work to peers with `send_to`.
# ─────────────────────────────────────────────────────────────────────────────
[tools]
enabled = [
  "bash",
  "read",
  "write",
  "send_to",
  "list_agents",
  "stop_agent",
  "monitor",
  "edit",
  "glob",
  "grep",
  "websearch",
  "webfetch",
  # "spawn",        # opt-in: let the agent create detached peers of its own
]
# Backward compatibility: the pre-rename names ("shell", "fs_read", "fs_write")
# are still accepted in `enabled` and map to bash / read / write respectively.

# Bash tool tuning. (The legacy `[tools.shell]` block is still accepted as an
# alias, but `timeout_secs` is ignored — use `timeout_ms` here.)
[tools.bash]
timeout_ms    = 120000   # per-command timeout in milliseconds
max_output_kb = 256      # truncate stdout/stderr beyond this (KB)

# Web search tool (opt-in network tool). When `endpoint` / `api_key_env` are
# unset, `websearch` returns a clear configuration error instead of failing.
# [tools.websearch]
# api_key_env = "TAVILY_API_KEY"
# endpoint    = "https://api.tavily.com/search"
# provider    = "tavily"            # supported: "tavily"

# ─────────────────────────────────────────────────────────────────────────────
# UI: what the REPL draws.
# ─────────────────────────────────────────────────────────────────────────────
[ui]
# Volume of thinking blocks: "collapsed" (default) | "expanded" | "hidden".
show_thinking    = "collapsed"
# Activity line + spinner/elapsed while a turn runs (interactive terminals only).
show_progress    = true
# Colour the output: "auto" (terminals only, honours NO_COLOR) / "always" / "never".
color            = "auto"
# Scroll the session log with the mouse wheel, keeping the prompt line pinned.
# While this is on the terminal reports mouse events to agent-cli, so selecting
# text needs the usual Shift override.
mouse_scroll     = true
# Lines of output kept for scrolling back (0 disables the wheel scrollback).
scrollback_lines = 2000

# ─────────────────────────────────────────────────────────────────────────────
# Spawn: how far an agent may go in creating agents of its own. These bound the
# `spawn` *tool* (the path the model takes on its own); `agent-cli spawn` and
# the REPL's /spawn are a person deciding and are not bounded. They have no
# effect until "spawn" is in [tools] enabled above.
# ─────────────────────────────────────────────────────────────────────────────
[spawn]
max_children = 4          # live direct children per agent (0 disables spawning)
max_depth    = 2          # depth of the spawn chain (0 disables spawning)

# ─────────────────────────────────────────────────────────────────────────────
# Shell: running `!<command>` typed at the prompt. This is your own command,
# not a tool call the model asked for, so it is not subject to the approval
# gate or to [tools] enabled.
# ─────────────────────────────────────────────────────────────────────────────
[shell]
enabled       = true      # false => a `!` line is sent to the model as a prompt
timeout_ms    = 120000    # kill the whole job after this long
max_output_kb = 256       # how much of the output the model is given (screen shows all)
context       = true      # hand the command and its output to the model as context

# ─────────────────────────────────────────────────────────────────────────────
# History: opt-in hybrid context-window management.
# When disabled (default), the full conversation is replayed verbatim each turn.
# ─────────────────────────────────────────────────────────────────────────────
[history]
enabled            = false
max_context_tokens = 24000
keep_recent_turns  = 6

# ─────────────────────────────────────────────────────────────────────────────
# MCP: external Model Context Protocol servers. Every discovered tool is
# registered as `mcp__<server>__<tool>` and passes the normal approval gate.
# A server that fails to start or handshake is logged and skipped.
# ─────────────────────────────────────────────────────────────────────────────
# [mcp]
# init_timeout_ms = 15000          # handshake + tools/list timeout per server

# --- stdio server (a local process) ---
# [[mcp.servers]]
# name    = "filesystem"
# command = "npx"
# args    = ["-y", "@modelcontextprotocol/server-filesystem", "/srv/data"]
# env     = { NODE_ENV = "production" }
# cwd     = "/srv/data"
# enabled = true

# --- HTTP (Streamable HTTP) server ---
# [[mcp.servers]]
# name        = "remote"
# transport   = "http"
# url         = "https://mcp.example.com/mcp"
# headers     = { X-Tenant = "acme" }
# api_key_env = "MCP_API_KEY"       # sent as `Authorization: Bearer <value>`
